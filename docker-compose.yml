# pgvector. 이 파일은 이제 DB 만 맡는다.
#
# 백엔드와 터널은 여기 없다 — k3s(Colima) 로 옮겼다. DB 는 클러스터 밖에
# 남고, 클러스터의 백엔드가 macOS 호스트의 5433 으로 붙는다. 즉 아래
# 포트 매핑은 로컬 개발 편의가 아니라 **배포 경로**다. 지우면 클러스터가
# DB 에 닿지 못한다.
#
# **Docker Desktop 에서 돌린다.** 데이터 볼륨(secuagent_pgdata)이 거기 있고,
# 클러스터는 macOS 호스트의 5433 으로 붙는다. `colima start` 가 활성 docker
# 컨텍스트를 가져가므로 컨텍스트를 지정하지 않으면 Colima VM 안에 빈
# pgvector 가 하나 더 생긴다:
#
#   docker --context desktop-linux compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    # 노트북 위에서 돌고 터널로 공개된다 — 도커 데몬 재시작이나 재부팅 뒤에
    # 사람이 붙어야 살아나면 그건 배포가 아니다.
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      POSTGRES_USER: secuagent
      POSTGRES_PASSWORD: secuagent
      POSTGRES_DB: secuagent
    ports:
      - "5433:5432"   # 5432 는 다른 로컬 Postgres 와 부딪히기 쉬워 피한다
    volumes:
      - secuagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secuagent"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  secuagent_pgdata:
