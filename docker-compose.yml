# 로컬 개발용 pgvector.
services:
  db:
    image: pgvector/pgvector:pg16
    # 노트북 위에서 돌고 터널로 공개된다 — 도커 데몬 재시작이나 재부팅 뒤에
    # 사람이 붙어야 살아나면 그건 배포가 아니다.
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      POSTGRES_USER: secuagent
      POSTGRES_PASSWORD: secuagent
      POSTGRES_DB: secuagent
    ports:
      - "5433:5432"   # 5432 는 다른 로컬 Postgres 와 부딪히기 쉬워 피한다
    volumes:
      - secuagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secuagent"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 서비스 이름이 곧 네트워크 별칭이다 — Compose 가 자동으로 붙이고 끌 수
  # 없다. `backend` 로 두면 안 되는 이유: 이 백엔드는 배포 시
  # docker-compose.tunnel.yml 로 다른 스택의 네트워크에도 참여하는데, 그
  # 네트워크에 이미 `backend` 라는 별칭을 가진 컨테이너가 있다. 실측: 둘이
  # 같은 이름을 가지자 DNS 가 두 IP 를 번갈아 주어 남의 서비스가 절반씩
  # 끊겼다. 이름을 고유하게 두는 것이 그 사고를 구조적으로 막는다.
  secu-backend:
    build: ./backend
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # 헬스체크가 없으면 도커는 컨테이너가 살아 있다는 것만 알고, DB 가 한 번
    # 튀어 커넥션이 죽은 채로 영구히 실패하는 상태를 구별하지 못한다.
    # start_period 가 길다 — 콜드 스타트에서 첫 /healthz 가 임베딩 모델
    # 로드를 동기로 트리거해 ~30초 걸린다. 짧게 주면 기동 중인 컨테이너를
    # 계속 죽이는 루프에 빠진다.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=10).status == 200 else 1)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECUAGENT_DSN: postgresql://secuagent:secuagent@db:5432/secuagent
      # 값을 여기 적지 않는다 — 이 파일은 공개 저장소에 있고, 백엔드는
      # 터널로 공개된다(docker-compose.tunnel.yml). 평문으로 두면 누구나
      # 읽어서 /ask 를 부를 수 있고 그 뒤에는 LLM 요금이 있다.
      #
      # `:?` 를 쓴다. 기본값을 주면 설정을 빠뜨린 채로 기동이 성공해버리고,
      # 그 순간 아는 값으로 열린 백엔드가 된다. api/security.py 가 시크릿
      # 미설정을 500 으로 거부하는 것과 같은 방향 — 닫히는 쪽으로 실패한다.
      BACKEND_SHARED_SECRET: ${BACKEND_SHARED_SECRET:?.env 에 설정한다. openssl rand -base64 32 | tr -d '/+='}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      # 컨테이너 안의 경로다. 아래 volumes 가 읽기 전용으로 마운트한다.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
    volumes:
      # 서비스 계정 JSON. 이미지에 굽지 않는다 — 이미지는 레지스트리에 올라간다.
      - ./gcp-sa.json:/run/secrets/gcp-sa.json:ro
    ports:
      # 호스트 포트를 .env 로 옮길 수 있게 둔다. 커밋되지 않는
      # docker-compose.override.yml 로 이것을 바꾸면, 저장소에 남은 배포
      # 절차가 저장소에 없는 파일을 요구하게 된다.
      - "${SECU_BACKEND_PORT:-8080}:8080"

volumes:
  secuagent_pgdata:
