---
layout: base
---
<section style="padding:80px 0 120px;">
  <div class="wrap-narrow" style="padding:0 24px;">
    <p class="eyebrow"><a href="{{ '/' | relative_url }}" style="color:var(--blue);">Secu-Agent</a> · 문서</p>
    <h1 style="font-size:42px;margin-bottom:8px;">{{ page.title }}</h1>

    <div class="prose">
      {{ content }}
    </div>

    <div style="margin-top:64px;padding-top:32px;border-top:1px solid var(--line-2);">
      <a class="btn btn-ghost" href="{{ '/' | relative_url }}">← 프로젝트 개요로</a>
    </div>
  </div>
</section>

<style>
/* 마크다운 본문 — 긴 산문을 읽기 좋게. */
.prose{font-size:17px;line-height:1.78;color:var(--ink-2);}
.prose h2{
  font-size:30px;color:var(--ink);margin:64px 0 18px;
  padding-bottom:12px;border-bottom:2px solid var(--ink);
}
.prose h3{font-size:21px;color:var(--ink);margin:44px 0 14px;}
.prose h4{font-size:17px;color:var(--ink);margin:32px 0 10px;}
.prose p{margin:0 0 18px;}
.prose ul,.prose ol{margin:0 0 18px;padding-left:22px;}
.prose li{margin-bottom:9px;}
.prose li::marker{color:var(--ink-4);}
.prose strong{color:var(--ink);font-weight:600;}
.prose hr{border:0;border-top:1px solid var(--line-2);margin:48px 0;}
.prose blockquote{
  margin:24px 0;padding:18px 24px;background:var(--blue-bg);
  border-radius:var(--radius-s);border-left:3px solid var(--blue);
  color:var(--ink);font-weight:500;
}
.prose blockquote p:last-child{margin-bottom:0;}
.prose pre{
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;
  padding:18px 20px;overflow-x:auto;font-size:13.5px;line-height:1.65;margin:0 0 18px;
}
.prose pre code{background:transparent;padding:0;font-size:inherit;}
.prose table{margin:0 0 18px;font-size:15px;border:1px solid var(--line-2);border-radius:12px;}
.prose td,.prose th{border-bottom:1px solid var(--line-2);}
.prose img{border-radius:12px;border:1px solid var(--line-2);margin:8px 0 18px;}
@media (max-width:820px){
  .prose{font-size:16px;}
  .prose h2{font-size:24px;margin-top:44px;}
  .prose h3{font-size:19px;}
}
</style>
