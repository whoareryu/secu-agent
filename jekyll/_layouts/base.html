<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — 권한이 반영된 사내 규정 AI 에이전트{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | truncate: 160 }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | truncate: 160 }}">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/* ─────────────────────────────────────────────────────────────
   Secu-Agent 프로젝트 사이트
   넉넉한 여백 · 한 절에 한 가지 · 큰 헤드라인 + 회색 두 줄 부제.
   ───────────────────────────────────────────────────────────── */
:root{
  --ink:      #191F28;   /* 본문 */
  --ink-2:    #4E5968;   /* 부제 */
  --ink-3:    #8B95A1;   /* 보조 */
  --ink-4:    #B0B8C1;   /* 흐릿 */
  --line:     #E5E8EB;
  --line-2:   #F2F4F6;
  --bg:       #FFFFFF;
  --bg-2:     #F9FAFB;
  --bg-3:     #F2F4F6;
  --blue:     #3182F6;
  --blue-d:   #1B64DA;
  --blue-bg:  #EBF3FE;
  --green:    #00B25D;
  --green-bg: #E8F8F0;
  --amber:    #F59E0B;
  --amber-bg: #FEF6E7;
  --red:      #F04452;
  --red-bg:   #FEECEE;
  --radius:   20px;
  --radius-s: 12px;
  --shadow:   0 1px 3px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
  --shadow-h: 0 2px 6px rgba(0,0,0,.05), 0 16px 40px rgba(0,0,0,.07);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", system-ui, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-padding-top:88px;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.6;
  letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  word-break:keep-all;overflow-wrap:break-word;
}
a{color:var(--blue);text-decoration:none;}
a:hover{text-decoration:underline;}
img{display:block;max-width:100%;height:auto;}
code{font-family:var(--mono);font-size:.88em;background:var(--bg-3);
     padding:.12em .38em;border-radius:5px;letter-spacing:0;}

/* ── 네비 ───────────────────────────────────────────────── */
.nav{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line-2);
}
.nav-in{
  max-width:1180px;margin:0 auto;height:64px;padding:0 24px;
  display:flex;align-items:center;gap:28px;
}
.nav-logo{
  font-weight:800;font-size:18px;color:var(--ink);letter-spacing:-.03em;
  text-decoration:none;flex-shrink:0;
}
.nav-logo:hover{text-decoration:none;}
.nav-logo span{color:var(--blue);}
.nav-links{display:flex;gap:24px;flex:1;overflow-x:auto;scrollbar-width:none;}
.nav-links::-webkit-scrollbar{display:none;}
.nav-links a{
  color:var(--ink-2);font-size:15px;font-weight:500;white-space:nowrap;
  text-decoration:none;padding:4px 0;
}
.nav-links a:hover{color:var(--ink);text-decoration:none;}
.nav-cta{
  flex-shrink:0;background:var(--blue);color:#fff;font-weight:600;font-size:14px;
  padding:9px 16px;border-radius:10px;text-decoration:none;white-space:nowrap;
}
.nav-cta:hover{background:var(--blue-d);text-decoration:none;}

/* ── 레이아웃 ────────────────────────────────────────────── */
.wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
.wrap-narrow{max-width:860px;margin:0 auto;padding:0 24px;}
section{padding:120px 0;}
section.tint{background:var(--bg-2);}
section.tint-3{background:var(--bg-3);}

.eyebrow{
  display:inline-block;font-size:14px;font-weight:700;color:var(--blue);
  letter-spacing:.02em;margin:0 0 14px;
}
h1,h2,h3,h4{letter-spacing:-.035em;line-height:1.24;margin:0;font-weight:700;}
h1{font-size:52px;line-height:1.18;}
h2{font-size:40px;}
h3{font-size:24px;letter-spacing:-.025em;}
h4{font-size:18px;letter-spacing:-.02em;}
.lead{
  margin:20px 0 0;font-size:19px;line-height:1.68;color:var(--ink-2);
  max-width:660px;font-weight:400;
}
.section-head{margin-bottom:56px;}

/* ── 버튼 ───────────────────────────────────────────────── */
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px;}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:15px 26px;border-radius:14px;font-size:16px;font-weight:600;
  text-decoration:none;border:1px solid transparent;transition:.15s;
}
.btn:hover{text-decoration:none;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-d);transform:translateY(-1px);}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line);}
.btn-ghost:hover{background:var(--bg-2);border-color:var(--ink-4);}
.btn .dot{
  width:7px;height:7px;border-radius:50%;background:#7BE8B0;
  box-shadow:0 0 0 3px rgba(123,232,176,.3);
}

/* ── 카드 ───────────────────────────────────────────────── */
.grid{display:grid;gap:20px;}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));}
.card{
  background:#fff;border:1px solid var(--line-2);border-radius:var(--radius);
  padding:32px;
}
.card.flat{background:var(--bg-2);border-color:transparent;}
.card h3,.card h4{margin:0 0 10px;}
.card p{margin:0;color:var(--ink-2);font-size:15.5px;line-height:1.68;}
.card p + p{margin-top:12px;}

.stat{background:#fff;border:1px solid var(--line-2);border-radius:var(--radius);padding:28px;}
.stat .n{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ink);}
.stat .n small{font-size:19px;font-weight:700;color:var(--ink-3);margin-left:2px;letter-spacing:-.02em;}
.stat .k{margin-top:10px;font-size:14.5px;font-weight:600;color:var(--ink-2);}
.stat .s{margin-top:4px;font-size:13px;color:var(--ink-3);line-height:1.5;}

/* ── 태그 ───────────────────────────────────────────────── */
.tag{
  display:inline-block;padding:5px 11px;border-radius:8px;
  font-size:12.5px;font-weight:600;letter-spacing:0;
}
.tag-blue{background:var(--blue-bg);color:var(--blue-d);}
.tag-green{background:var(--green-bg);color:var(--green);}
.tag-amber{background:var(--amber-bg);color:#B45309;}
.tag-red{background:var(--red-bg);color:var(--red);}
.tag-gray{background:var(--bg-3);color:var(--ink-2);}
.tags{display:flex;flex-wrap:wrap;gap:6px;}

/* ── 표 ─────────────────────────────────────────────────── */
.table-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--radius);background:#fff;}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:600px;}
th,td{padding:15px 20px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-2);}
th{font-size:13px;font-weight:600;color:var(--ink-3);background:var(--bg-2);white-space:nowrap;}
tr:last-child td{border-bottom:0;}
td strong{font-weight:600;}
th .sub,td .sub{display:block;color:var(--ink-3);font-size:13.5px;margin-top:3px;line-height:1.55;font-weight:400;}

/* ── 스크린샷 ───────────────────────────────────────────── */
.shot{
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  background:#fff;box-shadow:var(--shadow);
}
/* 화면마다 세로 길이가 달라 카드 높이가 들쭉날쭉했다. 비율을 고정하고
   위를 기준으로 잘라 카드가 나란히 서게 한다 — 헤더가 잘리면 어느 화면인지
   알 수 없으므로 object-position 은 top 이다. */
.shot img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover;object-position:top;}
.shot-grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));align-items:start;}
@media (max-width:940px){.shot-grid{grid-template-columns:1fr;}}
.shot-cap{padding:20px 24px;border-top:1px solid var(--line-2);background:#fff;}
.shot-cap h4{margin:0 0 6px;}
.shot-cap p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.62;}
.shot-cap .path{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin-top:8px;letter-spacing:0;}

/* ── 타임라인 ───────────────────────────────────────────── */
.tl{position:relative;padding-left:34px;}
.tl::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--line);}
.tl-item{position:relative;padding-bottom:36px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{
  content:"";position:absolute;left:-30px;top:6px;width:12px;height:12px;
  border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--bg-2);
}
.tl-item.now::before{background:var(--blue);box-shadow:0 0 0 4px var(--blue-bg);}
.tl-item.todo::before{background:#fff;border:2px solid var(--line);box-shadow:0 0 0 4px var(--bg-2);}
.tl-when{font-size:13.5px;font-weight:600;color:var(--ink-3);font-family:var(--mono);letter-spacing:0;}
.tl-item h4{margin:5px 0 8px;}
.tl-item p{margin:0;color:var(--ink-2);font-size:15.5px;line-height:1.68;}

/* ── 진행률 ─────────────────────────────────────────────── */
.bar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--blue);}

/* ── 목록 ───────────────────────────────────────────────── */
ul.clean{margin:0;padding:0;list-style:none;}
ul.clean li{
  position:relative;padding-left:24px;margin-bottom:12px;
  color:var(--ink-2);font-size:15.5px;line-height:1.68;
}
ul.clean li::before{
  content:"";position:absolute;left:6px;top:10px;width:6px;height:6px;
  border-radius:50%;background:var(--blue);
}
ul.clean li:last-child{margin-bottom:0;}
ul.clean li strong{color:var(--ink);font-weight:600;}

/* ── 인용 ───────────────────────────────────────────────── */
.quote{
  border-left:3px solid var(--blue);padding:4px 0 4px 22px;margin:0;
  font-size:19px;line-height:1.62;font-weight:600;color:var(--ink);
  letter-spacing:-.02em;
}

/* ── 푸터 ───────────────────────────────────────────────── */
footer{background:#fff;border-top:1px solid var(--line-2);padding:64px 0 72px;}
.foot{display:flex;flex-wrap:wrap;gap:40px;justify-content:space-between;}
.foot .name{font-size:20px;font-weight:700;letter-spacing:-.03em;}
.foot p{margin:8px 0 0;color:var(--ink-3);font-size:14.5px;line-height:1.6;}
.foot-links{display:flex;flex-direction:column;gap:8px;}
.foot-links a{color:var(--ink-2);font-size:15px;}

/* ── 반응형 ─────────────────────────────────────────────── */
@media (max-width:820px){
  body{font-size:16px;}
  section{padding:80px 0;}
  h1{font-size:34px;letter-spacing:-.03em;}
  h2{font-size:28px;letter-spacing:-.03em;}
  h3{font-size:20px;}
  .lead{font-size:17px;margin-top:16px;}
  .section-head{margin-bottom:36px;}
  .card{padding:24px;}
  .nav-links{display:none;}
  .nav-in{gap:16px;justify-content:space-between;}
  .btn{padding:14px 22px;font-size:15px;}
  .btns{margin-top:28px;}
  .foot{gap:28px;}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="nav-logo" href="{{ '/' | relative_url }}">Secu<span>-</span>Agent</a>
    <div class="nav-links">
      <a href="{{ '/#overview' | relative_url }}">개요</a>
      <a href="{{ '/#system' | relative_url }}">시스템 구성</a>
      <a href="{{ '/#principles' | relative_url }}">개발 원칙</a>
      <a href="{{ '/#schedule' | relative_url }}">일정·현황</a>
      <a href="{{ '/#review' | relative_url }}">개발 리뷰</a>
      <a href="{{ '/#roadmap' | relative_url }}">확장·BM</a>
      <a href="{{ '/#appendix' | relative_url }}">부록</a>
    </div>
    <a class="nav-cta" href="https://whoareryu.cloud" target="_blank" rel="noopener">라이브 데모 ↗</a>
  </div>
</nav>

{{ content }}

<footer>
  <div class="wrap foot">
    <div>
      <div class="name">류준 <span style="color:var(--ink-4);font-weight:500;">Ryu Jun</span></div>
      <p>{{ site.description | strip_newlines }}</p>
    </div>
    <div class="foot-links">
      <a href="https://whoareryu.cloud" target="_blank" rel="noopener">라이브 데모 · whoareryu.cloud ↗</a>
      <a href="https://github.com/{{ site.github_username }}/secu-agent" target="_blank" rel="noopener">GitHub · {{ site.github_username }}/secu-agent ↗</a>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
    </div>
  </div>
</footer>

</body>
</html>
