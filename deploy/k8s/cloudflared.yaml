# secu-agent 전용 터널.
#
# 예전에는 이 맥의 `whoareryu-cloudflared` 가 새싹 스택과 공유된 브리지에서
# `http://secu-backend:8080` 을 이름으로 불렀다. 지워진 docker-compose.tunnel.yml
# 이 그 구성의 위험을 스스로 적어 두고 있었다 — 같은 네트워크에 남의
# redis·pgvector·adminer 가 있어 도달성이 양방향이고, 공유 시크릿이 유일한
# 방어선이라고.
#
# 백엔드가 클러스터로 들어오면서 그 분리가 공짜로 된다. 이 cloudflared 는
# 클러스터 안에서 ClusterIP 로만 백엔드에 닿고, 남의 스택은 백엔드가 있는
# 네트워크에 아예 존재하지 않는다. 새싹 쪽 설정은 건드리지 않았다.
#
# 터널은 **토큰 방식**이다. 라우트(호스트명 → http://secu-backend:8080)는
# Cloudflare 대시보드에 있고 자격증명은 Secret 에 있다 — 설정 파일도,
# 저장소에 남는 비밀도 없다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: secu-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          # 다이제스트가 아니라 태그를 핀한다. cloudflared 는 서버 쪽
          # 프로토콜 변경을 따라가야 해서, 너무 오래 고정하면 연결이 거부된다.
          image: cloudflare/cloudflared:2025.8.1
          args:
            - tunnel
            - --no-autoupdate
            # 컨테이너 안에서 자기 자신을 갱신하면 재시작 시 되돌아간다.
            # 이미지 태그가 버전을 정하게 둔다.
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: { name: secu-agent, key: TUNNEL_TOKEN }
          # cloudflared 자신의 상태다. 백엔드가 죽었는지는 보지 않는다 —
          # 그건 백엔드의 probe 가 볼 일이고, 여기서 겹쳐 보면 백엔드
          # 재시작마다 터널까지 끊긴다.
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
