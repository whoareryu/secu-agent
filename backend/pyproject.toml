[project]
name = "secu-agent"
version = "0.1.0"
description = "운동 컨텍스트 기반 로컬 플레이스 큐레이션"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
# 파인튜닝 환경. 기본 설치에 넣지 않는다 — torch 만 2GB 가까이 되고,
# 평가 하네스와 파이프라인은 이것 없이 돌아야 한다.
#   설치: uv sync --group finetune
#   spec 2.3 은 임베딩 파인튜닝을 8주 범위에서 제외했다. 환경은 갖추되,
#   실제 학습에 착수하려면 일정 재조정이 필요하다.
finetune = [
    "torch>=2.6",
    "sentence-transformers>=3.3",
    "transformers>=4.48",
    "datasets>=3.2",
    "accelerate>=1.3",
    "peft>=0.14",
    "scikit-learn>=1.6",
]

dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# LLM 실호출 테스트는 비용이 들고 결과가 매번 달라 CI 에서 제외한다.
# 실행하려면: pytest -m llm
markers = [
    "llm: 실제 LLM API 를 호출하는 테스트 (기본 제외)",
]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "eval"]
