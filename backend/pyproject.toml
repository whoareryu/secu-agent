[project]
name = "secu-agent"
version = "0.1.0"
description = "운동 컨텍스트 기반 로컬 플레이스 큐레이션"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pypdf>=5.1",
    "sentence-transformers>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# LLM 실호출 테스트는 비용이 들고 결과가 매번 달라 CI 에서 제외한다.
# 실행하려면: pytest -m llm
# DB 테스트는 컨테이너가 없는 환경(CI, 남의 체크아웃)에서 실패하므로 제외한다.
# 실행하려면: pytest -m db
markers = [
    "llm: 실제 LLM API 를 호출하는 테스트 (기본 제외)",
    "db: 실제 데이터베이스가 필요한 테스트 (기본 제외)",
    "model: 실제 임베딩 모델을 로드하는 테스트 (기본 제외, 로드에 ~30초)",
]
addopts = "-m 'not llm and not db and not model'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "eval"]
