[project]
name = "secu-agent"
version = "0.1.0"
description = "권한 기반 보안 정책 문서 검색 에이전트"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "langchain>=1.3",
    "langchain-google-genai>=4.3",
    "langgraph>=1.2",
    "psycopg[binary]>=3.2",
    "pypdf>=5.1",
    "pyyaml>=6.0",
    "sentence-transformers>=3.3",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# LLM 실호출 테스트는 비용이 들고 결과가 매번 달라 CI 에서 제외한다.
# 실행하려면: pytest -m llm
# DB 테스트는 컨테이너가 없는 환경(CI, 남의 체크아웃)에서 실패하므로 제외한다.
# 실행하려면: pytest -m db
markers = [
    "llm: 실제 LLM API 를 호출하는 테스트 (기본 제외)",
    "db: 실제 데이터베이스가 필요한 테스트 (기본 제외)",
    "model: 실제 임베딩 모델을 로드하는 테스트 (기본 제외, 로드에 ~30초)",
    "slow: 반복 측정처럼 느린 테스트. -m 'not slow' 로 제외할 수 있다",
]
addopts = "-m 'not llm and not db and not model'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "eval"]
