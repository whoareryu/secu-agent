name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['jekyll/**', 'docs/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: secuagent
          POSTGRES_PASSWORD: secuagent
          POSTGRES_DB: secuagent
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U secuagent"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen 이 없으면 uv 가 매 실행마다 의존성을 **다시 해결**한다.
      # 그러면 CI 초록불이 잠금 파일을 보증하지 않고, 같은 커밋을 다음 주에
      # 다시 돌리면 다른 스택에서 도는 셈이 된다. langchain 1.x 는 마이너에서도
      # 에이전트 API 가 움직인다.
      - name: 의존성 설치
        working-directory: backend
        run: uv sync --dev --frozen

      - name: 린트
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # DB·LLM·모델 테스트는 pyproject 의 addopts 가 기본 제외한다.
      # 컨테이너도 API 키도 없고 임베딩 모델도 받아져 있지 않은 환경에서
      # 스위트 전체가 실패하면 안 된다.
      - name: 테스트
        working-directory: backend
        run: uv run pytest -v

      # 위 기본 스위트는 -m db 를 제외하므로 권한 필터(_권한_WHERE)를 건드리는
      # 코드는 이 스텝을 통과하지 않는다. 예: required_clearance 비교를
      # <= 에서 >= 로 뒤집어도 기본 스위트는 전부 초록불이다 — 그 회귀를
      # 잡는 테스트가 전부 -m db 라서다. 이 스텝이 그 테스트를 실행한다.
      - name: DB 테스트
        working-directory: backend
        env:
          SECUAGENT_DSN: postgresql://secuagent:secuagent@localhost:5433/secuagent
        run: uv run pytest -m db -v

  # 프론트엔드는 여기 들어오기 전까지 CI 를 전혀 통과하지 않았다 —
  # TypeScript 9천 줄, 화면 7개, 라우트 핸들러 6개, 그리고 관리자 게이트가
  # 검사 없이 들어왔다. 로컬 실행만으로는 부족하다는 증거도 이 브랜치에 있다:
  # tsconfig.tsbuildinfo 증분 캐시가 진짜 타입 오류를 한 번 가렸다.
  # 그래서 캐시가 없는 환경에서 매번 처음부터 돌린다.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # 로컬(v24.17.0)과 맞춘다
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 테스트
        working-directory: frontend
        run: npm test

      - name: 타입 검사
        working-directory: frontend
        run: npx tsc --noEmit

      # 빌드에 환경변수를 주지 않는다. .env.local 이 없고 환경변수가 하나도
      # 없는 상태에서 빌드가 통과하는 것을 실측으로 확인했다 — 모든 라우트가
      # 요청 시점 렌더(ƒ)라 빌드가 auth() 나 백엔드를 부르지 않는다.
      # 여기에 더미 값을 넣어두면 그 사실이 가려지고, 진짜 비밀이 필요해지는
      # 순간에도 CI 는 계속 초록불을 낸다.
      - name: 빌드
        working-directory: frontend
        run: npm run build

  # Dockerfile 과 compose 는 여기 들어오기 전까지 어떤 검사도 받지 않았다 —
  # 깨진 채로 머지돼도 CI 는 초록불이고, 배포하려는 순간에야 안다.
  # 이미지를 실제로 빌드해 본다(푸시하지 않는다). 임베딩 모델을 굽는
  # 단계가 있어 느리지만, 그 단계가 깨지는 것이 정확히 잡고 싶은 일이다.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # compose 는 이제 db 하나다. 오버레이도 변수 보간도 없으므로
      # 문법이 깨진 채로 머지되는 것만 막으면 된다.
      - name: compose 문법
        run: docker compose config -q

      - name: 백엔드 이미지 빌드
        run: docker build -t secu-agent-backend:ci ./backend

      # compose 가 검사받지 않던 것과 같은 자리에 k8s 매니페스트가 있었다 —
      # 깨진 채로 머지돼도 초록불이고, 배포하려는 순간에야 안다.
      #
      # kubeconform 은 클러스터 없이 쿠버네티스 JSON 스키마로 검사한다.
      # -strict 가 있어야 오타 필드(`imagePullpolicy`)를 잡는다 — 그것이
      # 없으면 모르는 필드를 그냥 통과시켜서, 정작 배포에서 조용히 무시된다.
      #
      # **이 검사가 잡지 못하는 것을 적어 둔다.** 스키마는 맞지만 런타임에
      # 죽는 것들 — 이름 USER 에 runAsNonRoot 만 준 경우,
      # /run/secrets 를 디렉터리로 마운트해 서비스어카운트 토큰과 부딪히는
      # 경우 — 은 실제 클러스터에서만 드러난다. 그 둘은 매니페스트 주석과
      # 배포 스펙 §4.3 에 남겼다.
      - name: k8s 매니페스트 스키마
        run: |
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform
          ./kubeconform -strict -summary deploy/k8s/
