name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'jekyll/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: jekyll

      # **이 워크플로는 저장소가 public 이어야 돈다.** 무료 플랜은 private
      # 저장소에 Pages 를 주지 않는다. 없으면 이 스텝이 Not Found 로 죽고
      # Build with Jekyll 은 skipped 가 된다 — Jekyll 이 실행조차 되지
      # 않으므로, 로그만 보고 Jekyll 이 깨졌다고 읽으면 안 된다.
      #
      # 실측: 2026-09-04 8fde4f5 까지 성공했고 70b6beb 부터 계속 실패했다.
      # 그 사이에 저장소가 private 으로 바뀌었다.
      #
      # enablement: true 로 액션이 직접 켜게 하는 것을 시도했고 실패했다
      # ("Create Pages site failed. Resource not accessible by integration").
      # 권한 문제로 보이지만 원인이 아니라 증상이다 — Pages 를 쓸 수 없는
      # 저장소에서 사이트를 만들려 했으니 거부된 것이다. 그래서 그 옵션을
      # 두지 않는다. 켜 두면 되는 것처럼 보이지만 실패 지점만 한 칸 뒤로
      # 밀린다.
      #
      # public 으로 되돌린 뒤 Settings → Pages → Source 를 "GitHub Actions"
      # 로 한 번 지정하면, 그 뒤로는 이 스텝이 읽기만 하면 된다.
      - id: pages
        uses: actions/configure-pages@v5

      # baseurl 을 여기서 덮어쓴다.
      # _config.yml 의 baseurl 은 빈 값(로컬 `jekyll serve` 기준)이고,
      # 배포는 프로젝트 페이지라 `/secu-agent` 가 한 겹 붙는다.
      # 사이트 안의 링크는 전부 `relative_url` 필터를 통과하므로 양쪽에서 동작한다.
      - name: Build with Jekyll
        working-directory: jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: jekyll/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
